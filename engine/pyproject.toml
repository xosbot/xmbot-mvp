[project]
name = "xmbot-engine"
version = "0.1.0"
description = "XMBot AI Trading Engine — Human-in-the-loop multi-agent trading platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    # Kept in sync with requirements.txt (what the Dockerfile actually installs) —
    # these were previously only there, so `pip install -e .[dev]` didn't match
    # what runs in production.
    "sqlalchemy>=2.0.0",
    "sentry-sdk>=2.0.0",
    "websockets>=12.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
    "asyncio-throttle>=1.0.0",
]

[project.optional-dependencies]
ibkr = ["ibapi>=9.81.1"]
mt5 = ["MetaTrader5>=5.0.0"]
ai = ["anthropic>=0.30.0", "google-genai>=0.3.0", "openai>=1.0.0"]
all = ["ibapi", "MetaTrader5", "anthropic", "google-genai", "openai"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative starter set: pyflakes, pycodestyle, isort, pyupgrade. Deliberately
# excludes blind-except rules (BLE) — the agent/position-monitor loops intentionally
# catch broad `Exception` to keep the engine alive across a bad tick or API error.
# UP042 (str+Enum -> StrEnum) is excluded: it's ruff's "unsafe fix" category and
# would touch how every SignalAction/OrderStatus/etc. formats across logs, the
# Telegram bot, and API responses — not worth the blast radius for a style rule.
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# These re-export modules have a load-bearing import order to avoid circular
# imports (e.g. src/__init__.py must import .core before .agents) — isort's
# alphabetical reordering (I001) breaks that. Everything else about them still
# gets linted.
"src/__init__.py" = ["I001"]
"src/core/__init__.py" = ["I001"]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
