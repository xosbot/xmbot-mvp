[project]
name = "xmbot-engine"
version = "0.1.0"
description = "XMBot AI Trading Engine — Human-in-the-loop multi-agent trading platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ibkr = ["ibapi>=9.81.1"]
mt5 = ["MetaTrader5>=5.0.0"]
ai = ["anthropic>=0.30.0", "google-genai>=0.3.0", "openai>=1.0.0"]
all = ["ibapi", "MetaTrader5", "anthropic", "google-genai", "openai"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
