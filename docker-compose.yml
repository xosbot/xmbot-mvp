services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xmbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xmbot_dev}
      POSTGRES_DB: xmbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - xmbot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmbot -d xmbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - xmbot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - engine_data:/app/data
    ports:
      - "8080:8080"
    networks:
      - xmbot-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./xmbot-mvp
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - engine
    ports:
      - "3000:3000"
    networks:
      - xmbot-net
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - xmbot-net
    depends_on:
      - engine
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  engine_data:
  caddy_data:
  caddy_config:

networks:
  xmbot-net:
    driver: bridge
