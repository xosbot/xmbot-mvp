services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    networks:
      - xmbot-net

  web:
    build:
      context: ./xmbot-mvp
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - engine
    ports:
      - "3006:3000"
    networks:
      - xmbot-net

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - xmbot-net
    depends_on:
      - engine
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  xmbot-net:
    driver: bridge
